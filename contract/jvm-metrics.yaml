# JVM metrics contract: the metrics (and labels) that our dashboards and alerts depend on.
#
# Each signal maps a logical name to the metric that currently carries it, and each
# logical label to the label name that currently carries it. Dashboards and alert rules
# are generated from this file (scripts/build_dashboard.py, scripts/build_rules.py), and CI
# checks it against the schema the pinned agent version really emits (scripts/check_schema.py).
job: otel-agent
# Agent version this contract was verified against (its snapshot defines "expected" metric names)
agent_version: 2.33.1
signals:
  memory_used:
    metric: jvm_memory_used_bytes
    labels: {type: jvm_memory_type, pool: jvm_memory_pool_name}
  memory_limit:
    metric: jvm_memory_limit_bytes
    labels: {type: jvm_memory_type, pool: jvm_memory_pool_name}
  cpu_utilization:
    metric: jvm_cpu_recent_utilization
  gc_duration:
    metric: jvm_gc_duration_seconds
    histogram: true
    labels: {gc: jvm_gc_name, action: jvm_gc_action}
  threads:
    metric: jvm_thread_count
    labels: {daemon: jvm_thread_daemon}
  classes_loaded:
    metric: jvm_class_count
