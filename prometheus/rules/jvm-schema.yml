- name: jvm-schema-change
  rules:
  - alert: JvmMetricNameAppeared
    expr: 'label_replace((group by (__name__, service) ({job="otel-agent", __name__=~".*jvm.*"})

      unless

      group by (__name__, service) ({job="otel-agent", __name__=~".*jvm.*"} offset 10m))

      and on (service) group by (service) (up{job="otel-agent"} offset 10m == 1), "metric", "$1", "__name__", "(.+)")'
    labels:
      severity: info
    annotations:
      summary: New JVM metric {{ $labels.metric }} on {{ $labels.service }} (not there 10m ago)
  - alert: JvmMetricNameDisappeared
    expr: 'label_replace((group by (__name__, service) ({job="otel-agent", __name__=~".*jvm.*"} offset 10m)

      unless

      group by (__name__, service) ({job="otel-agent", __name__=~".*jvm.*"}))

      and on (service) group by (service) (up{job="otel-agent"} == 1), "metric", "$1", "__name__", "(.+)")'
    labels:
      severity: warning
    annotations:
      summary: JVM metric {{ $labels.metric }} on {{ $labels.service }} disappeared in the last 10m
  - alert: JvmMetricCountChanged
    expr: 'count by (service) (group by (__name__, service) ({job="otel-agent", __name__=~".*jvm.*"}))

      != on (service)

      count by (service) (group by (__name__, service) ({job="otel-agent", __name__=~".*jvm.*"} offset 10m))'
    labels:
      severity: warning
    annotations:
      summary: '{{ $labels.service }} now emits {{ $value }} JVM metric names (changed in the last 10m)'
