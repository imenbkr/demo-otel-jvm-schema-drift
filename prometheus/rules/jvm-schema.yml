- name: jvm-schema-change
  rules:
  - alert: JvmMetricNameAppeared
    expr: '(group by (metric, service) (label_replace({job="otel-agent", __name__=~".*jvm.*"}, "metric", "$1", "__name__", "(.+)"))

      unless

      group by (metric, service) (label_replace({job="otel-agent", __name__=~".*jvm.*"} offset 10m, "metric", "$1", "__name__", "(.+)")))

      and on (service) group by (service) (up{job="otel-agent"} offset 10m == 1)'
    labels:
      severity: info
    annotations:
      summary: New JVM metric {{ $labels.metric }} on {{ $labels.service }} (not there 10m ago)
  - alert: JvmMetricNameDisappeared
    expr: '(group by (metric, service) (label_replace({job="otel-agent", __name__=~".*jvm.*"} offset 10m, "metric", "$1", "__name__", "(.+)"))

      unless

      group by (metric, service) (label_replace({job="otel-agent", __name__=~".*jvm.*"}, "metric", "$1", "__name__", "(.+)")))

      and on (service) group by (service) (up{job="otel-agent"} == 1)'
    labels:
      severity: warning
    annotations:
      summary: JVM metric {{ $labels.metric }} on {{ $labels.service }} disappeared in the last 10m
  - alert: JvmMetricCountChanged
    expr: 'count by (service) (group by (metric, service) (label_replace({job="otel-agent", __name__=~".*jvm.*"}, "metric", "$1", "__name__", "(.+)")))

      != on (service)

      count by (service) (group by (metric, service) (label_replace({job="otel-agent", __name__=~".*jvm.*"} offset 10m, "metric", "$1", "__name__", "(.+)")))'
    labels:
      severity: warning
    annotations:
      summary: '{{ $labels.service }} now emits {{ $value }} JVM metric names (changed in the last 10m)'
