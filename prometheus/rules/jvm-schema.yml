      unless

      group by (service) (jvm_memory_used_bytes{job="otel-agent"})'
    for: 1m
    labels:
      severity: critical
      signal: memory_used
      metric: jvm_memory_used_bytes
    annotations:
      summary: '{{ $labels.service }} stopped emitting jvm_memory_used_bytes'
      description: Signal 'memory_used' in the JVM metrics contract has no data. Dashboards and alerts built on it now show 'No data'.
